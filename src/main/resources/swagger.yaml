openapi: 3.0.0
info:
  title: Bank Process Api
  version: 1.0.0
  description: API for Banking

paths:
  /account:
    post:
      tags:
        - Bank
      summary: Create a Bank Account
      operationId: createAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/accountDto'

      responses:
        '201':
          description: Account Creation
          content:
            application/json:
              schema:
                type: string

        '500':
          description: internal server error
          content:
            application/json:
              schema:
                type: string

    get:
      tags:
        - Bank
      summary: Get Account details
      operationId: getAllAccounts
      responses:
        '200':
          description: get all Accounts  Details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/accountDto'

        '404':
          description: data not found
          content:
            application/json:
              schema:
                type: string

        '500':
          description: internal server error
          content:
            application/json:
              schema:
                type: string

  /deposit/{accountNumber}:
    put:
      tags:
        - Bank
      summary: update account details
      operationId: updateAccount
      parameters:
        - name: accountNumber
          required: true
          in: path
          schema:
            type: integer

      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/accountDto"

      responses:
        "201":
          description: Account details updated
          content:
            application/json:
              schema:
                type: string

        "500":
          description: internal server error
          content:
            application/json:
              schema:
                type: string

        "404":
          description: data not found
          content:
            application/json:
              schema:
                type: string

  /withdraw/{accountNumber}:
    put:
      tags:
        - Bank
      summary: update account details
      operationId: updateAccount
      parameters:
        - name: accountNumber
          required: true
          in: path
          schema:
            type: integer

      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/accountDto"

      responses:
        "201":
          description: Account details updated
          content:
            application/json:
              schema:
                type: string

        "500":
          description: internal server error
          content:
            application/json:
              schema:
                type: string

        "404":
          description: data not found
          content:
            application/json:
              schema:
                type: string

components:
  schemas:
    accountDto:
      type: object
      properties:
        accountNumber:
          type: string
        accountHolderName:
          type: string
        balance:
          type: number
          format: double
        mobileNumber:
          type: integer

